<!DOCTYPE html>
<html lang="es" data-tema="claro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar a la Plataforma · Avancemos</title>
  <meta name="description" content="Ingresa a la red social y al panel de participación de Avancemos.">
  <link rel="icon" href="assets/icono.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/publico.css">
</head>
<body>
  <header class="sitio-header">
    <div class="contenedor sitio-nav">
      <a href="index.html" class="sitio-logo" aria-label="Inicio">
        <img src="assets/logo.svg" alt="Avancemos Logo">
      </a>
      <div class="sitio-acciones">
        <span style="font-size: var(--fs-sm); color: var(--texto-suave);">¿Aún no tienes cuenta?</span>
        <a href="unete.html" class="btn btn-primario btn-sm">Únete</a>
      </div>
    </div>
  </header>

  <main class="contenedor" style="padding-top: 4rem; padding-bottom: 5rem; max-width: 440px;">
    <div class="tarjeta">
      <div style="text-align: center; margin-bottom: 2rem;">
        <h2>Ingresar a Avancemos</h2>
        <p style="font-size: var(--fs-sm); color: var(--texto-suave); margin-top: 0.5rem;">
          Accede a tu cuenta territorial, publicaciones y grupos.
        </p>
      </div>

      <form id="form-ingreso">
        <div class="campo">
          <label class="campo-etiqueta" for="email">Correo electrónico</label>
          <input type="email" id="email" class="campo-input" required placeholder="tu@correo.com">
        </div>

        <div class="campo">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label class="campo-etiqueta" for="password">Contraseña</label>
            <a href="restablecer.html" style="font-size: var(--fs-xs);">¿Olvidaste tu contraseña?</a>
          </div>
          <input type="password" id="password" class="campo-input" required placeholder="••••••••••••">
        </div>

        <button type="submit" class="btn btn-primario btn-lg" style="width: 100%; margin-top: 1rem;" id="btn-login">
          Iniciar Sesión
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: var(--fs-xs); color: var(--texto-suave);">
        ¿Eres moderador o administrador? El panel solicitará tu código TOTP AAL2 al ingresar.
      </div>
    </div>
  </main>

  <script type="module">
    import { iniciarSesion } from "./js/auth.js";
    import { cargarPermisos } from "./js/permisos.js";
    import { mostrarToast } from "./js/ui/toast.js";
    import { inicializarWidgetSoporte } from "./js/ui/widget-soporte.js";
    inicializarWidgetSoporte();

    const form = document.getElementById("form-ingreso");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btn-login");
      btn.disabled = true;
      btn.textContent = "Ingresando...";

      try {
        await iniciarSesion(form.email.value.trim(), form.password.value);
        const perms = await cargarPermisos(true);

        if (perms.es_admin_nacional || (perms.departamentos_moderacion && perms.departamentos_moderacion.length > 0)) {
          window.location.href = "admin.html";
        } else {
          window.location.href = "app.html";
        }
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "Iniciar Sesión";
        mostrarToast(err.message || "Credenciales incorrectas", "error");
      }
    });
  </script>
</body>
</html>
